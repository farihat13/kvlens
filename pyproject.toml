# The uv workspace: three packages under python/. `just setup` installs kvevaluator and kvcost,
# and the engines extra: kvengines (real-database clients) and its drivers.
[project]
name = "kvlens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kvevaluator",
    "kvcost",
    "rocksdict==0.3.29",   # experiments/: one grouped-search step reads a Python RocksDB store
]

[project.optional-dependencies]
engines = ["kvengines"]
# `just lint`'s standard tools (tests/lint/check_lint_tools.py runs them): pinned, so a count moves only with the code
lint = ["ruff==0.17.3", "vulture==2.16", "lizard==1.24.3", "import-linter==2.15"]

[tool.uv]
package = false
# The versions the freeze commit's outputs were made with (the paper's figures are compared by pixels).
constraint-dependencies = [
    "contourpy==1.3.3", "cycler==0.12.1", "fonttools==4.61.1", "kiwisolver==1.4.9", "packaging==26.0",
    "pillow==12.1.1", "pyparsing==3.3.2", "python-dateutil==2.9.0.post0", "six==1.17.0",
    "pytz==2025.2", "tzdata==2025.3",
    # kvengines' clients
    "anyio==4.12.1", "certifi==2026.1.4", "charset-normalizer==3.4.4", "future==1.0.0", "h11==0.16.0", "h2==4.3.0",
    "hpack==4.1.0", "httpcore==1.0.9", "httplib2==0.31.2", "httpx==0.28.1", "hyperframe==6.1.0", "idna==3.11",
    "pyjwt==2.12.1", "requests-toolbelt==1.0.0", "typing-extensions==4.15.0", "urllib3==2.6.3",
]

[tool.uv.workspace]
members = ["python/kvevaluator", "python/kvcost", "python/kvengines"]

[tool.uv.sources]
kvevaluator = { workspace = true }
kvcost = { workspace = true }
kvengines = { workspace = true }
