# https://docs.arango.ai/arangodb/stable/operations/administration/configuration/
[server]
endpoint = tcp://0.0.0.0:8529
authentication = false
statistics = true

[database]
directory = @DATADIR@

[javascript]
startup-directory = @SRCDIR@/js
app-path = @DATADIR@/apps

[log]
file = @LOGFILE@
level = info
# level = all=warning
# level = queries=trace
# level = startup=info

[rocksdb]
# block-cache-size = 4294967296
# write-buffer-size=512KiB
# block-cache-size=512MiB
# total-write-buffer-size=2GiB
# max-bytes-for-level-multiplier=1K

[cache]
# size=2G