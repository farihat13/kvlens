# name|output_relpath|dgraph_patches|badger_patches|make_env|description
# dgraph_patches/badger_patches: comma-separated patch paths relative to engines/dgraph/ ($MY_DGRAPH_ROOTDIR). Use "-" for none.
# make_env: semicolon-separated KEY=VALUE pairs passed to `make dgraph`. Use "-" for none.
#   Common variables: BUILD_CODENAME, BUILD_TAGS, BUILD_DEBUG
#   Examples: BUILD_CODENAME=my-build
#             BUILD_TAGS=functrace
#             BUILD_DEBUG=1
#
# Example:
# my-variant|custom/my-dgraph|patches/dgraph-profile.patch|patches/badger-profile.patch|BUILD_CODENAME=my-dgraph;BUILD_TAGS=functrace|custom build with tracing
original|dgraph-orig|-|-|BUILD_CODENAME=dgraph-original|original build
debug|dgraph-debug|-|-|BUILD_CODENAME=dgraph-debug;BUILD_DEBUG=1;BUILD_TAGS=debug|debug build
metrics|dgraph-metrics|patches/dgraph-profile.patch|patches/badger-profile.patch|BUILD_CODENAME=dgraph-metrics;BUILD_TAGS=histogram|profile latency metrics build
kvtime|dgraph-kvtime|patches/dgraph-profile.patch|patches/badger-profile.patch|BUILD_CODENAME=dgraph-profile;BUILD_TAGS=badgerbusy|profile storage wall clock build
profile|dgraph-profile|patches/dgraph-profile.patch|patches/badger-profile.patch|BUILD_CODENAME=dgraph-profile;BUILD_TAGS=functrace badgerbusy histogram kvstats|full profile build (includes /detsort/* knob and kvstats counters)
