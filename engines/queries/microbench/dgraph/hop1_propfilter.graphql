# hop1_propfilter -- a person's friends (both directions) created before 2011-01-01 (T4), counted.
# Reads: the anchor's knows and ~knows postings, then creationDate per distinct friend.
# Evaluator: queries/hop.py hop1_propfilter -> read creationDate -> filter
#   < DATE_CUTOFF (1293840000000 = 2011-01-01T00:00:00Z) -> count row. Count-final.
# The cutoff is a constant of the shape, so it is a literal here, not a param.
# mb2 lineage: MB33-34 (a message-date filter on hasCreator there).
# Anchor: Dgraph has no external-key addressing, so the person is found through the `id` int
#   index (eq(id, ...), 1 index read the evaluator does not pay: its anchor vid is given).
#   `id` is shared by all 8 LDBC types (person 985 collides with a tag, a place and an
#   organisation 985), so type(person) is what names THE person.
# answer-path: result
query q($personId: string) {
  var(func: eq(id, $personId)) @filter(type(person)) {
    f as knows
    r as ~knows
  }
  result(func: uid(f, r)) @filter(lt(creationDate, "2011-01-01T00:00:00Z")) {
    uid
  }
}
