# hop1p7_knows -- a person's friends (both directions) with 7 props each (width x fan-out).
# Reads: the anchor's knows and ~knows postings, then firstName, lastName, gender, birthday, creationDate, locationIP, browserUsed per distinct friend.
# Evaluator: queries/hop.py _hop1p(7) -> read PERSON_PROPS[:7] -> sort by firstName in RAM ->
#   one row per friend.
# Not ordered here: the evaluator's sort is an in-memory ordering of the same set. firstName
#   has only a hash (unsortable) index, so Dgraph's orderasc: firstName would fetch firstName
#   once for the sort and again for the output (LocalCache off).
# mb2 lineage: MB22 / MB26.
# Anchor: Dgraph has no external-key addressing, so the person is found through the `id` int
#   index (eq(id, ...), 1 index read the evaluator does not pay: its anchor vid is given).
#   `id` is shared by all 8 LDBC types (person 985 collides with a tag, a place and an
#   organisation 985), so type(person) is what names THE person.
# answer-path: result
query q($personId: string) {
  var(func: eq(id, $personId)) @filter(type(person)) {
    f as knows
    r as ~knows
  }
  result(func: uid(f, r)) {
    firstName
    lastName
    gender
    birthday
    creationDate
    locationIP
    browserUsed
  }
}
