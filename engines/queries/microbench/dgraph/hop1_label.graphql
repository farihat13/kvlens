# hop1_label -- a person's messages kept to Posts (T3), counted.
# Reads: the anchor's ~hasCreator posting, then the type(post) check on each message.
# Evaluator: queries/hop.py hop1_label -> read_filter_by_label_probe (dgraph: 1 dgraph.type
#   read per candidate) -> count row. Count-final, so one item per post.
# How Dgraph checks type(post) is the typefilterpath knob, not the query: at `index` (this
#   experiment's .env) it reads the whole post type posting once and intersects; at
#   `per_vertex` it reads each candidate's dgraph.type (the evaluator's probe). Measured:
#   at per_vertex the live SEEKs equal the evaluator's probe plus the 2-SEEK anchor.
# mb2 lineage: MB139-140 (this naive @filter form; MB39-40 is the intersection form).
# Anchor: Dgraph has no external-key addressing, so the person is found through the `id` int
#   index (eq(id, ...), 1 index read the evaluator does not pay: its anchor vid is given).
#   `id` is shared by all 8 LDBC types (person 985 collides with a tag, a place and an
#   organisation 985), so type(person) is what names THE person.
# answer-path: result.posts
query q($personId: string) {
  result(func: eq(id, $personId)) @filter(type(person)) {
    posts: ~hasCreator @filter(type(post)) {
      uid
    }
  }
}
