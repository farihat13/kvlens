# microbench hop1_hascreator -- the messages (Posts and Comments) a Person created.
# Evaluator: queries/hop.py _hop1("hasCreator", "in", "Person"): read_neighbors -> dedup ->
# count. Count-final: one row per message, the vid only.
# mb2 lineage: MB31-32 (MATCH).
# Form: GO REVERSELY over HAS_CREATOR (GetNeighbors on the in-edge prefix). For a reversed
# walk src(edge) is the far end (the message). $param note: see hop1_knows.gql.
YIELD $personId AS s
| GO FROM $-.s OVER HAS_CREATOR REVERSELY YIELD DISTINCT src(edge) AS id
