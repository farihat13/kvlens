# microbench nhop4 -- the Persons at knows-distance exactly 4 from a Person (both directions):
# the new BFS frontier after 4 hops, with a global visited set.
# Evaluator: queries/nhop.py _nhop(4): per hop read_neighbors(knows, both) -> dedup -> exclude
# everything seen -> the depth-4 frontier. The vid only. One row per frontier Person.
# mb2 lineage: MB41-44, 53-54 (MATCH KNOWS*1..k: a different question, every path <= k).
# Form: one GO per hop from the current frontier; MINUS drops every vertex already
# seen and UNION grows the seen set -- the evaluator's walk, hop for hop. The set steps run in
# graphd memory (no storage read); id($$) is the far end of each edge (free). The anchor enters
# through a YIELD because GO does not take a $param as the start vid in this Nebula.
# Replaces a GET SUBGRAPH form, which also keeps a visited set but expands one layer more and reads
# every tag of each vertex (nhop1 at p3: 128/512/5807 vs this form's 2/0/63).
$v0 = YIELD $personId AS id;
$h1 = GO FROM $v0.id OVER KNOWS BIDIRECT YIELD DISTINCT id($$) AS id;
$f1 = YIELD $h1.id AS id MINUS YIELD $v0.id AS id;
$v1 = YIELD $v0.id AS id UNION YIELD $f1.id AS id;
$h2 = GO FROM $f1.id OVER KNOWS BIDIRECT YIELD DISTINCT id($$) AS id;
$f2 = YIELD $h2.id AS id MINUS YIELD $v1.id AS id;
$v2 = YIELD $v1.id AS id UNION YIELD $f2.id AS id;
$h3 = GO FROM $f2.id OVER KNOWS BIDIRECT YIELD DISTINCT id($$) AS id;
$f3 = YIELD $h3.id AS id MINUS YIELD $v2.id AS id;
$v3 = YIELD $v2.id AS id UNION YIELD $f3.id AS id;
$h4 = GO FROM $f3.id OVER KNOWS BIDIRECT YIELD DISTINCT id($$) AS id;
YIELD $h4.id AS id MINUS YIELD $v3.id AS id;
