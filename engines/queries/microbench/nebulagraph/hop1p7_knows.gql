# microbench hop1p7_knows -- a Person's distinct knows-neighbours (both directions) with
# all 7 PERSON_PROPS.
# Evaluator: queries/hop.py _hop1p(7): read_neighbors -> dedup -> read_vertex_props(
# PERSON_PROPS[:7]) -> sort. One row per distinct neighbour; no id is read.
# mb2 lineage: none direct.  Form: see hop1p1_knows.gql.
YIELD $personId AS s
| GO FROM $-.s OVER KNOWS BIDIRECT
  YIELD DISTINCT id($$) AS id, $$.Person.firstName AS firstName, $$.Person.lastName AS lastName,
        $$.Person.gender AS gender, $$.Person.birthday AS birthday,
        $$.Person.creationDate AS creationDate, $$.Person.locationIP AS locationIP,
        $$.Person.browserUsed AS browserUsed
