# name|output_dir|nebula_patches|rocksdb_patches|cmake_flags|description
# nebula_patches/rocksdb_patches: comma-separated patch paths relative to engines/nebulagraph/ ($MY_NEBULA_ROOTDIR). Use "-" for none.
# cmake_flags: semicolon-separated KEY=VALUE pairs passed as cmake -D flags. Use "-" for none.
#   Examples: ENABLE_QUERY_PLAN_DEBUG=ON
#             CMAKE_BUILD_TYPE=Debug
#
# Example:
# my-variant|nebula-custom|patches/nebula.unified.patch|-|ENABLE_QUERY_PLAN_DEBUG=ON|custom build with query stats
original|nebula-orig|-|-|-|unpatched baseline
kvstats|nebula-kvstats|patches/nebula.unified.patch|-|ENABLE_KV_STATS=ON|KV ops experiment (counts + latency)
latency|nebula-latency|patches/nebula.unified.patch|-|ENABLE_KV_PROFILE=ON|latency breakdown experiment (PROFILE queries)
profile|nebula-profile|patches/nebula.unified.patch|-|ENABLE_KV_STATS=ON;ENABLE_KV_PROFILE=ON;ENABLE_KV_HISTOGRAMS=ON;ENABLE_QUERY_PLAN_DEBUG=ON|full profiling (all instrumentation)
plan-debug|nebula-plan-debug|patches/nebula.plan-debug.patch|-|ENABLE_QUERY_PLAN_DEBUG=ON|comprehensive query plan debugging
