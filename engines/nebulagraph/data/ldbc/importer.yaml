client:
  version: v3
  address: "127.0.0.1:9669"
  user: root
  password: nebula
  concurrencyPerAddress: 10
  reconnectInitialInterval: 1s
  retry: 3
  retryInitialInterval: 1s

manager:
  spaceName: ldbc
  batch: 128
  readerConcurrency: 50
  importerConcurrency: 512
  statsInterval: 10s

log:
  level: ERROR
  console: true
  files:
    - nebula-importer.log

sources:
  # dynamic - tags
  - path: dynamic/person_0_0.csv
    csv:
      delimiter: "|"
      withHeader: true
    tags:
      - name: Person
        id:
          type: "STRING"
          index: 0
        props:
          - name: firstName
            type: STRING
            index: 1
          - name: lastName
            type: STRING
            index: 2
          - name: gender
            type: STRING
            index: 3
          - name: birthday
            type: INT
            index: 4
          - name: creationDate
            type: INT
            index: 5
          - name: locationIP
            type: STRING
            index: 6
          - name: browserUsed
            type: STRING
            index: 7

  - path: dynamic/post_0_0.csv
