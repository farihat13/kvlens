      delimiter: "|"
      withHeader: true
    tags:
      - name: Post
        id:
          type: "STRING"
          index: 0
        props:
          - name: imageFile
            type: STRING
            index: 1
          - name: creationDate
            type: INT
            index: 2
          - name: locationIP
            type: STRING
            index: 3
          - name: browserUsed
            type: STRING
            index: 4
          - name: language
            type: STRING
            index: 5
          - name: content
