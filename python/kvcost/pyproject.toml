[project]
name = "kvcost"
version = "0.1.0"
description = "Layout cost, layout search, latency and plotting, built on kvevaluator."
requires-python = ">=3.12"
dependencies = ["kvevaluator", "matplotlib==3.10.8", "numpy==2.4.2"]

[project.scripts]
kvcost = "kvcost.cli.cli:main"   # kvcost <command>: python/kvcost/cli/README.md

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package dir is this member's root (python/kvcost/ holds __init__.py), so the wheel maps "." to "kvcost"
# and the editable install puts python/ on the path.
[tool.hatch.build.targets.wheel]
only-include = ["."]
sources = {"" = "kvcost"}
exclude = ["pyproject.toml"]
dev-mode-dirs = [".."]

[tool.uv.sources]
kvevaluator = { workspace = true }
